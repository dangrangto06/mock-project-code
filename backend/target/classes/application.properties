# ========================================================
# CodeForge Core Engine - Spring Boot Application Properties
# ========================================================
server.port=8080
spring.application.name=CodeForge-Backend

# --------------------------------------------------------
# 3. Database Layer: Microsoft SQL Server Configuration
# --------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CodeForgeDb;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.sql.init.mode=always

# --------------------------------------------------------
# 4. Judge0 API: Code Execution Sandbox Runner
# --------------------------------------------------------
judge0.api.url=https://judge0-ce.p.rapidapi.com
judge0.api.key=YOUR_RAPIDAPI_KEY_HERE
judge0.api.host=judge0-ce.p.rapidapi.com
judge0.timeout.ms=10000

# --------------------------------------------------------
# 5. External Email Service
# --------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@codeforge.io
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --------------------------------------------------------
# JWT Authentication Security
# --------------------------------------------------------
jwt.secret=CodeForgeSuperSecretSigningKeyThatIsLongEnoughForHMACSHA256Security123456
jwt.expirationMs=86400000

# Logging
logging.level.com.codeforge=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

