# ==============================================================================
# CodeForge Core Engine - Production Application Properties Configuration
# ==============================================================================
# Architectural Role:
# Defines runtime environment variables, database datasource parameters,
# execution sandbox gateway endpoints, mail provider settings, and security tokens.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Server Configuration
# ------------------------------------------------------------------------------
# Embedded Tomcat listening port
server.port=8080
# Application identifier within the Spring ecosystem
spring.application.name=CodeForge-Backend

# ------------------------------------------------------------------------------
# 2. Database Layer: Microsoft SQL Server Configuration
# ------------------------------------------------------------------------------
# JDBC connection string targeting local or containerized Microsoft SQL Server instance
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CodeForgeDb;encrypt=false;trustServerCertificate=true
# Administrative database credentials
spring.datasource.username=sa
spring.datasource.password=123
# Fully qualified JDBC driver class name
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ------------------------------------------------------------------------------
# 3. JPA & Hibernate Object-Relational Mapping (ORM) Settings
# ------------------------------------------------------------------------------
# Schema update policy: updates existing tables with any entity modifications without dropping data
spring.jpa.hibernate.ddl-auto=update
# Output executed SQL queries to standard out for debugging and query analysis
spring.jpa.show-sql=true
# Pretty-print SQL statements in console logs
spring.jpa.properties.hibernate.format_sql=true
# Hibernate SQL Server dialect for optimal SQL translation and type mappings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ------------------------------------------------------------------------------
# 4. Judge0 API: Code Execution Sandbox Runner Configuration
# ------------------------------------------------------------------------------
# Base URL for Judge0 Community Edition (CE) remote execution service
judge0.api.url=https://judge0-ce.p.rapidapi.com
# RapidAPI authentication key (if left as placeholder, Judge0Service uses fallback sandbox)
judge0.api.key=YOUR_RAPIDAPI_KEY_HERE
# RapidAPI routing host header
judge0.api.host=judge0-ce.p.rapidapi.com
# Synchronous execution wait timeout in milliseconds
judge0.timeout.ms=10000

# ------------------------------------------------------------------------------
# 5. External Email Service: SMTP Notifications
# ------------------------------------------------------------------------------
# SMTP mail server host
spring.mail.host=smtp.gmail.com
# TLS SMTP submission port
spring.mail.port=587
# Outgoing sender authentication credentials
spring.mail.username=notifications@codeforge.io
spring.mail.password=your_app_password
# Enable SMTP basic authentication
spring.mail.properties.mail.smtp.auth=true
# Mandate STARTTLS encryption on connection initiation
spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------------------------------------------------------
# 6. JWT (JSON Web Token) Stateless Authentication Security
# ------------------------------------------------------------------------------
# 256-bit symmetric signing secret for HMAC-SHA256 signature verification
jwt.secret=CodeForgeSuperSecretSigningKeyThatIsLongEnoughForHMACSHA256Security123456
# Token expiration duration: 86,400,000 ms (24 hours)
jwt.expirationMs=86400000

# ------------------------------------------------------------------------------
# 7. Logging Levels & Diagnostics
# ------------------------------------------------------------------------------
# Application-level logs
logging.level.com.codeforge=INFO
# Spring Web MVC routing logs
logging.level.org.springframework.web=INFO
# Hibernate ORM entity persistence logs
logging.level.org.hibernate=INFO
