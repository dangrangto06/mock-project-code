# ==============================================================================
# CodeForge Core Engine - Production Application Properties Configuration
# ==============================================================================
# Architectural Role:
# Defines runtime environment variables, database datasource parameters,
# execution sandbox gateway endpoints, mail provider settings, and security tokens.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Server & Application Configuration
# ------------------------------------------------------------------------------
# Embedded Tomcat listening port
server.port=8080
# Application identifier within the Spring ecosystem
spring.application.name=CodeForge-Backend

# Optional import for local secrets (ignored by Git, fails gracefully if absent)
spring.config.import=optional:classpath:application-secrets.properties

# ------------------------------------------------------------------------------
# 2. Database Layer: Microsoft SQL Server Configuration
# ------------------------------------------------------------------------------
# JDBC connection string targeting local or containerized Microsoft SQL Server instance
spring.datasource.url=jdbc:sqlserver://localhost\\VUATRUYVAN;databaseName=CodeForgeDb;encrypt=false;trustServerCertificate=true
# Administrative database credentials
spring.datasource.username=sa
spring.datasource.password=123
# Fully qualified JDBC driver class name
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ------------------------------------------------------------------------------
# 3. JPA & Hibernate Object-Relational Mapping (ORM) Settings
# ------------------------------------------------------------------------------
# Schema update policy: updates existing tables with any entity modifications without dropping data
spring.jpa.hibernate.ddl-auto=update
# Output executed SQL queries to standard out for debugging and query analysis
spring.jpa.show-sql=true
# Pretty-print SQL statements in console logs
spring.jpa.properties.hibernate.format_sql=true
# Hibernate SQL Server dialect for optimal SQL translation and type mappings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ------------------------------------------------------------------------------
# 4. Judge0 API: Code Execution Sandbox Runner Configuration
# ------------------------------------------------------------------------------
# Enable live Judge0 execution (set false to force offline sandbox simulation)
judge0.live.enabled=true
# Enable free public Judge0 CE gateway (https://ce.judge0.com) when RapidAPI key is unset
judge0.ce.enabled=true
judge0.ce.url=https://ce.judge0.com
# Base URL for RapidAPI or custom self-hosted Judge0 gateway
judge0.api.url=https://judge0-ce.p.rapidapi.com
# RapidAPI authentication key (if left as placeholder, Judge0Service uses Judge0 CE or self-hosted URL)
judge0.api.key=YOUR_RAPIDAPI_KEY_HERE
# RapidAPI routing host header
judge0.api.host=judge0-ce.p.rapidapi.com
# Optional X-Auth-Token header for self-hosted Judge0 instances
judge0.auth.token=${JUDGE0_AUTH_TOKEN:}
# Synchronous execution / polling wait timeout in milliseconds
judge0.timeout.ms=10000

# ------------------------------------------------------------------------------
# 5. External Email Service: SMTP Notifications
# ------------------------------------------------------------------------------
# SMTP mail server host
spring.mail.host=smtp.gmail.com
# TLS SMTP submission port
spring.mail.port=587
# Outgoing sender authentication credentials
spring.mail.username=codeforgeadmin@gmail.com
spring.mail.password=zfcyyimfbwuuwdpn
# Enable SMTP basic authentication
spring.mail.properties.mail.smtp.auth=true
# Mandate STARTTLS encryption on connection initiation
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ------------------------------------------------------------------------------
# 6. JWT (JSON Web Token) Stateless Authentication Security
# ------------------------------------------------------------------------------
# 256-bit symmetric signing secret for HMAC-SHA256 signature verification
jwt.secret=CodeForgeSuperSecretSigningKeyThatIsLongEnoughForHMACSHA256Security123456
# Token expiration duration: 86,400,000 ms (24 hours)
jwt.expirationMs=86400000

# ------------------------------------------------------------------------------
# 7. Logging Levels & Diagnostics
# ------------------------------------------------------------------------------
# Application-level logs
logging.level.com.codeforge=INFO
# Spring Web MVC routing logs
logging.level.org.springframework.web=INFO
# Hibernate ORM entity persistence logs
logging.level.org.hibernate=INFO

# ------------------------------------------------------------------------------
# 8. GitHub OAuth2 & Frontend Base URL
# ------------------------------------------------------------------------------
github.oauth.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
github.oauth.redirect-uri=http://localhost:8080/api/auth/github/callback
frontend.base-url=http://localhost:3000

# ------------------------------------------------------------------------------
# 9. CodeForge AI Chatbot (ForgeBot) Configuration
# ------------------------------------------------------------------------------
# Optional Gemini / OpenAI / LLM API key. If absent, ForgeBot uses CodeForge Grounded AI Engine
ai.chatbot.api.key=${AI_CHATBOT_API_KEY:}
ai.chatbot.model=gemini-1.5-flash


