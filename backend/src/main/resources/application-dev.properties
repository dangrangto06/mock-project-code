# ==============================================================================
# CodeForge Core Engine - Local Development & Test Profile (application-dev)
# ==============================================================================
# Architectural Role:
# Activated via --spring.profiles.active=dev or @ActiveProfiles("dev").
# Configures a lightweight, zero-dependency in-memory H2 database engine,
# bypassing the need for an external Microsoft SQL Server instance during local
# development or automated continuous integration testing.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. H2 In-Memory Database Datasource
# ------------------------------------------------------------------------------
# In-memory database URL with persistence throughout JVM lifecycle (DB_CLOSE_DELAY=-1)
spring.datasource.url=jdbc:h2:mem:codeforgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------------------------
# 2. JPA & Hibernate In-Memory Configuration
# ------------------------------------------------------------------------------
# In-memory H2 dialect for SQL statement translation
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Automatically create tables on startup and drop upon JVM shutdown
spring.jpa.hibernate.ddl-auto=create-drop
# Disable raw SQL script initialization; DataSeeder handles database seeding via JPA
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------------------------
# 3. H2 Interactive Web Console
# ------------------------------------------------------------------------------
# Enable the built-in browser-based SQL console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
